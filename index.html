<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte de saut — generateur de galaxie</title>
<link rel="stylesheet" href="/src/view/style.css">
</head>
<body>

<div class="top">
  <div class="t1" id="titre">Galaxie</div>
  <div class="t2" id="sous-titre"></div>
</div>

<div class="btns">
  <button id="b-retour" class="amb" hidden>← Carte de saut</button>
  <button id="b-vue">Vue d'ensemble</button>
  <button id="b-neuf">Nouvelle galaxie</button>
  <button id="b-depart" class="amb">◎ Depart</button>
  <button id="b-portee">Portee de saut</button>
</div>

<div class="prop" id="prop" hidden>
  <div class="prop-t">Portee de saut</div>
  <div class="prop-n">Outil d'inspection : previsualise ce que la branche Propulsion de l'arbre de recherche ouvrira.</div>
  <div class="prop-b" id="paliers"></div>
  <div class="prop-i" id="prop-info"></div>
</div>

<div class="aide" id="aide">Glisser pour pivoter · molette pour zoomer · cliquer une etoile pour son releve</div>

<div class="find" id="find">
  <div class="hits" id="hits"></div>
  <input id="q" placeholder="Chercher un systeme" autocomplete="off" spellcheck="false">
</div>

<div class="card" id="card">
  <button class="x" id="close">✕</button>
  <h2 id="c-nom"></h2>
  <div class="kind" id="c-kind"></div>
  <div class="hook" id="c-hook" hidden></div>
  <div class="grid" id="c-grid"></div>
  <div id="c-corps"></div>
  <button class="entrer" id="b-entrer" hidden>Entrer dans le systeme →</button>
</div>

<script type="module" src="/src/view/main.ts"></script>
</body>
</html>
